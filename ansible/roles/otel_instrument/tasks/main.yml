---
# Injects the opentelemetry-operator auto-instrumentation agent and the OTEL_*
# environment into running OpenStack service containers, then recreates them.
# Mirrors kolla's own service-check-containers / handler pattern (the
# kolla_container + kolla_container_facts modules).

- name: Validate the requested action
  run_once: true
  ansible.builtin.assert:
    that:
      - otel_action in ['instrument', 'rollback']
    fail_msg: >-
      'otel_action' must be 'instrument' or 'rollback', got
      '{{ otel_action }}'.

# The effective target list is the built-in/base services plus any the operator
# adds via otel_instrument_extra_services (extend, don't override). Everything
# below operates on this combined list.
- name: Combine base and extra instrument services
  ansible.builtin.set_fact:
    otel_instrument_services_all: >-
      {{ otel_instrument_services + otel_instrument_extra_services }}

# When no external collector is configured, target the per-host local
# collector (deployed by the otel_collector role). This makes the exporter
# endpoint always well-defined, so there is nothing left to validate.
#
# otel_local_collector_endpoint resolves this host's api_interface address,
# which needs network facts. The play runs with gather_facts:false (kolla
# usually serves these from its fact cache), so gather them on demand when they
# are absent and we are actually in local-collector mode.
- name: Gather network facts for the local collector endpoint
  when:
    - otel_exporter_endpoint | length == 0
    - (api_interface | default('lo', true) | replace('-', '_')) not in ansible_facts
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - network

- name: Default the exporter endpoint to the local collector when unset
  when: otel_exporter_endpoint | length == 0
  ansible.builtin.set_fact:
    otel_exporter_endpoint: "{{ otel_local_collector_endpoint }}"

- name: Validate every targeted service maps to a known language
  run_once: true
  ansible.builtin.assert:
    that:
      - item.language in otel_language_defaults
    fail_msg: >-
      Service '{{ item.name }}' uses unknown language '{{ item.language }}'.
      Known languages: {{ otel_language_defaults.keys() | list | join(', ') }}.
      Add it under 'otel_languages' or fix the 'language' field.
  loop: "{{ otel_instrument_services_all }}"
  loop_control:
    label: "{{ item.name }}"

- name: Compute deployment-wide resource attributes
  when: otel_action == 'instrument'
  ansible.builtin.set_fact:
    otel_resource_attributes_base: >-
      {{ {'service.namespace': otel_service_namespace}
         | combine({'deployment.environment': otel_deployment_environment}
                   if otel_deployment_environment | length > 0 else {})
         | combine(otel_resource_attributes_extra) }}

# The role needs each container's full inspect attrs (Config.Env / Config.Labels
# / HostConfig.Binds / privileged / …). Newer kolla_container_facts returns them
# via `action=get_containers`; older kolla (e.g. 18.8.0) has no `action` and its
# docker path returns only the `docker ps` summary (no Config/HostConfig). So try
# the modern facts module, and on failure fall back to inspecting the containers
# directly with the container engine — which yields full attrs on any release.
# Both paths normalize into otel_containers = {container_name: attrs}, and the
# current environment is derived from attrs.Config.Env (no separate env call).
- name: Discover which target containers are present on this host
  vars:
    otel_target_names: >-
      {{ otel_instrument_services_all
         | map(attribute='container_name') | list }}
  block:
    - name: Discover present containers (modern kolla_container_facts)
      become: true
      kolla_container_facts:
        container_engine: "{{ kolla_container_engine }}"
        action: get_containers
        name: "{{ otel_target_names }}"
      register: otel_facts_modern
    - name: Normalize modern container facts
      ansible.builtin.set_fact:
        otel_containers: "{{ otel_facts_modern.containers }}"
  rescue:
    - name: Inspect present target containers directly (legacy kolla)
      # `<engine> inspect` emits a JSON array of the containers that exist and
      # errors (non-zero) on any that do not; keep the found ones regardless.
      become: true
      ansible.builtin.command:
        argv: "{{ [kolla_container_engine, 'inspect'] + otel_target_names }}"
      register: otel_inspect
      changed_when: false
      failed_when: false
    - name: Normalize inspected container attrs
      vars:
        otel_inspected: "{{ (otel_inspect.stdout | trim or '[]') | from_json }}"
      ansible.builtin.set_fact:
        otel_containers: >-
          {{ dict(otel_inspected | map(attribute='Name')
                  | map('regex_replace', '^/', '') | list
                  | zip(otel_inspected)) }}

- name: Select the target services present on this host
  ansible.builtin.set_fact:
    otel_present_services: >-
      {{ otel_instrument_services_all
         | selectattr('container_name', 'in', otel_containers.keys() | list)
         | list }}

# Stage each distinct language once (pull + copy), rather than repeating the
# per-language work inside the per-service loop below.
- name: Stage the agent for each language present on this host
  when: otel_action == 'instrument'
  ansible.builtin.include_tasks: stage.yml
  loop: >-
    {{ otel_present_services | map(attribute='language') | unique | list }}
  loop_control:
    loop_var: otel_stage_language
    label: "{{ otel_stage_language }}"

- name: Inject OpenTelemetry into each present container
  when: otel_action == 'instrument'
  ansible.builtin.include_tasks: inject.yml
  loop: "{{ otel_present_services }}"
  loop_control:
    loop_var: otel_service
    label: "{{ otel_service.name }} ({{ otel_service.container_name }})"

# --- Rollback ---------------------------------------------------------------
- name: Roll back OpenTelemetry from each present container
  when: otel_action == 'rollback'
  ansible.builtin.include_tasks: rollback.yml
  loop: "{{ otel_present_services }}"
  loop_control:
    loop_var: otel_service
    label: "{{ otel_service.name }} ({{ otel_service.container_name }})"

# Once every targeted container on this host has been rolled back, nothing
# mounts the staged agent any more, so the host artifacts can be removed.
- name: Remove staged agent artifacts from the host
  when:
    - otel_action == 'rollback'
    - otel_rollback_remove_agent | bool
    - otel_present_services | length > 0
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ (otel_present_services | map(attribute='language') | unique
        | map('regex_replace', '^(.*)$', otel_host_lib_path ~ '/\1') | list)
       + (otel_present_services | map(attribute='language') | unique
          | map('regex_replace', '^(.*)$',
                otel_host_lib_path ~ '/.\1-image-id') | list) }}
  loop_control:
    label: "{{ item }}"
