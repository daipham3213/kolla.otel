---
###############################################################################
# kolla-otel :: OpenTelemetry auto-instrumentation injection
#
# These defaults mirror the kolla_otel Python domain model (OTelConfig +
# per-language injectors). Override them in globals.yml or via the CLI's
# --config file (translated into extra-vars by `kolla-ansible otel-instrument`).
###############################################################################

# --- Action -----------------------------------------------------------------
# What this run does:
#   instrument - inject the agent + OTEL_* env and recreate (default)
#   rollback   - undo instrumentation: strip the managed env, drop the agent
#                bind-mount and the managed label, then recreate the container
#                back to its pre-instrumentation state.
# Set by the `kolla-ansible otel-instrument` / `otel-rollback` commands;
# override on the CLI (`-e otel_action=rollback`) when running ansible directly.
otel_action: "instrument"

# On rollback, also delete the agent artifacts staged under
# otel_host_lib_path from the host (they are useless once nothing mounts
# them). Set to false to keep them for a quick re-instrument.
otel_rollback_remove_agent: true

# Desired-state switch for the bundled `kolla_container` action plugin, which
# shapes kolla's container spec whenever kolla itself (re)creates a targeted
# container during `deploy` / `reconfigure`:
#   true  - re-apply instrumentation (env + agent mount + label) so it persists
#           without a re-run. The plugin stages the agent on the host itself
#           (pull + copy) before the first (re)create, so no prior
#           `kolla-ansible otel-instrument` run is required. Set this (and the
#           otel_* config, including `otel_exporter_endpoint`) in globals.yml.
#   false - (default) strip any instrumentation from the spec so the container
#           is recreated WITHOUT it. kolla's own spec is normally already
#           clean, so this is usually a no-op, but it means flipping the switch
#           off and re-running deploy/reconfigure reliably removes the OTEL
#           env/mount/label instead of leaving whatever is running in place.
# Non-target containers and an explicit `otel-rollback` are always passed
# through untouched (rollback is handled by this role's own de-instrumentation).
otel_auto_instrument: false

# --- OTLP export configuration ---------------------------------------------
# The collector endpoint reachable from inside the service containers. Leave it
# empty to run in "local collector" mode: the otel_collector role deploys an
# opentelemetry-collector-contrib container on each host and instrumentation
# targets `otel_local_collector_endpoint` below. Set it to point at an external
# collector instead (e.g. http://otel-collector:4317), which disables the
# local collector.
otel_exporter_endpoint: ""
otel_exporter_protocol: "grpc"        # grpc | http/protobuf

# Endpoint used when otel_exporter_endpoint is empty (local collector mode).
# kolla uses host networking, so the per-host collector is reachable on this
# host's own address; target the IP of `api_interface` (kolla's management/API
# network, the same interface it resolves service addresses on, defaulting to
# `network_interface`) rather than loopback, so the endpoint is a routable
# address. Falls back to 127.0.0.1 if the interface address can't be resolved.
# The instrument role gathers network facts on demand when this is needed.
#
# The port follows otel_exporter_protocol: the collector's HTTP port
# (otel_collector_http_port, 4318) for http/protobuf, else its gRPC port
# (otel_collector_grpc_port, 4317). Keep both in sync with the collector role.
otel_local_collector_endpoint: >-
  http://{{ (ansible_facts[api_interface | default('lo', true)
  | replace('-', '_')] | default({}, true)).get(api_address_family
  | default(network_address_family | default('ipv4', true), true), {}).get('address', '127.0.0.1')
  | put_address_in_context('url') }}:{{ otel_collector_http_port | default(4318, true)
  if (otel_exporter_protocol | default('grpc', true)) == 'http/protobuf'
  else otel_collector_grpc_port | default(4317, true) }}

otel_traces_exporter: "otlp"
otel_metrics_exporter: "otlp"
otel_logs_exporter: "otlp"

otel_traces_sampler: "parentbased_traceidratio"
otel_traces_sampler_arg: "1.0"
otel_propagators: "tracecontext,baggage"

# --- Resource attributes ----------------------------------------------------
otel_service_namespace: "openstack"
otel_deployment_environment: ""       # optional, e.g. "production"
# Extra deployment-wide resource attributes (merged beneath per-service ones).
otel_resource_attributes_extra: {}

# --- Auto-instrumentation images (opentelemetry-operator) -------------------
otel_image_registry: "ghcr.io/open-telemetry/opentelemetry-operator"
otel_image_version: "latest"

# --- Agent staging ----------------------------------------------------------
# The agent is copied out of the image into a host directory and bind-mounted
# read-only into the service containers. Artifacts live under a per-language
# subdirectory, e.g. /etc/kolla/opentelemetry/python.
otel_host_lib_path: "/etc/kolla/opentelemetry"

# Container label used to record which environment keys this role injected, so
# the next run can prune any that were removed from config (declarative env).
otel_managed_env_label: "kolla_otel.managed_env"

# Built-in per-language injection strategy (source of truth): which image
# ships the agent, where its artifacts live in that image, where they mount in
# the target container, and the environment that activates the agent.
#
# Do NOT replace this wholesale to tweak one field — set only the keys you want
# to change under `otel_languages` (below); they are DEEP-merged onto these, so
# `activation` and the other defaults are never accidentally dropped.
otel_language_defaults:
  python:
    image_component: "autoinstrumentation-python"
    source_path: "/autoinstrumentation"
    mount_path: "/otel-auto-instrumentation-python"
    activation:
      PYTHONPATH: "/otel-auto-instrumentation-python/opentelemetry/instrumentation/auto_instrumentation:/otel-auto-instrumentation-python"
      # OpenStack services build on oslo.service; its OpenTelemetry
      # distro/configurator wires the SDK up the way OpenStack expects. Applied
      # as activation so it is always set for the Python agent.
      OTEL_PYTHON_DISTRO: "oslo_service"
      OTEL_PYTHON_CONFIGURATOR: "oslo_service"
  java:
    image_component: "autoinstrumentation-java"
    source_path: "/javaagent.jar"
    mount_path: "/otel-auto-instrumentation-java"
    activation:
      JAVA_TOOL_OPTIONS: "-javaagent:/otel-auto-instrumentation-java/javaagent.jar"
  nodejs:
    image_component: "autoinstrumentation-nodejs"
    source_path: "/autoinstrumentation"
    mount_path: "/otel-auto-instrumentation-nodejs"
    activation:
      NODE_OPTIONS: "--require /otel-auto-instrumentation-nodejs/autoinstrumentation.js"
  dotnet:
    image_component: "autoinstrumentation-dotnet"
    source_path: "/autoinstrumentation"
    mount_path: "/otel-auto-instrumentation-dotnet"
    activation:
      CORECLR_ENABLE_PROFILING: "1"
      CORECLR_PROFILER: "{918728DD-259F-4A6A-AC2B-B85E1B658318}"
      CORECLR_PROFILER_PATH: "/otel-auto-instrumentation-dotnet/linux-x64/OpenTelemetry.AutoInstrumentation.Native.so"
      DOTNET_STARTUP_HOOKS: "/otel-auto-instrumentation-dotnet/net/OpenTelemetry.AutoInstrumentation.StartupHook.dll"
      DOTNET_ADDITIONAL_DEPS: "/otel-auto-instrumentation-dotnet/AdditionalDeps"
      DOTNET_SHARED_STORE: "/otel-auto-instrumentation-dotnet/store"
      OTEL_DOTNET_AUTO_HOME: "/otel-auto-instrumentation-dotnet"

# Per-language overrides, DEEP-merged onto otel_language_defaults. Set only the
# keys you want to change, e.g. to relocate the Python mount path:
#   otel_languages:
#     python:
#       mount_path: /opt/otel-python
otel_languages: {}

# --- Target services --------------------------------------------------------
# Which containers to instrument. `name` is the OTel service name and volume
# suffix; `container_name` is the kolla/Docker container to recreate. Only
# containers actually present on a host are touched, so the same list is safe
# across controllers and compute nodes.
#
# The default target list is assembled from per-project lists below and gated
# by kolla's own `enable_<project>` flags — so it tracks what kolla actually
# deployed: enabling a project (e.g. `enable_cinder: true`) instruments its
# services, disabling it drops them, just like `enable_octavia` deploys octavia.
# Override `otel_instrument_services` wholesale to take full control, or add to
# it with `otel_instrument_extra_services` (below).
#
# Optional per-service keys:
#   otel_service_name    - override OTEL_SERVICE_NAME
#   resource_attributes  - extra OTEL_RESOURCE_ATTRIBUTES (map)
#   environment          - extra environment variables for just this service
#                          (map), e.g. tune sampling only for nova-api:
#     - name: nova-api
#       container_name: nova_api
#       language: python
#       environment:
#         OTEL_TRACES_SAMPLER_ARG: "0.1"
#         OTEL_PYTHON_LOG_CORRELATION: "true"
otel_services_keystone:
  - {name: keystone, container_name: keystone, language: python}
otel_services_nova:
  - {name: nova-api, container_name: nova_api, language: python}
  - {name: nova-conductor, container_name: nova_conductor, language: python}
  - {name: nova-scheduler, container_name: nova_scheduler, language: python}
  # nova_compute runs privileged with ipc_mode=host; the role reads those back
  # from the running container and re-applies them on recreate (see README).
  - {name: nova-compute, container_name: nova_compute, language: python}
otel_services_cinder:
  - {name: cinder-api, container_name: cinder_api, language: python}
  - {name: cinder-scheduler, container_name: cinder_scheduler, language: python}
  - {name: cinder-volume, container_name: cinder_volume, language: python}
  - {name: cinder-backup, container_name: cinder_backup, language: python}
otel_services_glance:
  - {name: glance-api, container_name: glance_api, language: python}
otel_services_neutron:
  - {name: neutron-server, container_name: neutron_server, language: python}
otel_services_placement:
  - {name: placement-api, container_name: placement_api, language: python}
otel_services_heat:
  - {name: heat-api, container_name: heat_api, language: python}
  - {name: heat-engine, container_name: heat_engine, language: python}

# Effective default target list: each project's services, included only when
# kolla's enable_<project> flag is truthy. In a real kolla run every enable_*
# is defined; the `default(...)` fallbacks only apply if one is somehow absent.
otel_instrument_services: >-
  {{ (otel_services_keystone if (enable_keystone | default(true) | bool) else [])
     + (otel_services_nova if (enable_nova | default(true) | bool) else [])
     + (otel_services_cinder if (enable_cinder | default(false) | bool) else [])
     + (otel_services_glance if (enable_glance | default(true) | bool) else [])
     + (otel_services_neutron if (enable_neutron | default(true) | bool) else [])
     + (otel_services_placement if (enable_placement | default(true) | bool) else [])
     + (otel_services_heat if (enable_heat | default(true) | bool) else []) }}

# Additional services to instrument, EXTENDING (not replacing)
# otel_instrument_services. Use this to add your own targets without having to
# restate the built-in list: the role and the action plugin both act on
# `otel_instrument_services + otel_instrument_extra_services`. Same entry schema
# as above (name, container_name, language, and optional otel_service_name /
# resource_attributes / environment).
otel_instrument_extra_services: []

# Services (by `name`) whose Python process runs under eventlet and so need the
# agent to eventlet-monkey-patch before instrumenting. Any target whose name is
# in this list gets OTEL_PYTHON_EVENTLET_MONKEY_PATCH=true. Defaults to all the
# eventlet daemons/servers; it deliberately excludes the uWSGI/mod_wsgi services
# (keystone, nova-api, cinder-api, placement-api), where monkey-patching would
# be wrong. Set to [] to disable everywhere, or adjust for your deployment.
otel_eventlet_services:
  - nova-conductor
  - nova-scheduler
  - nova-compute
  - cinder-scheduler
  - cinder-volume
  - cinder-backup
  - neutron-server
  - glance-api
  - heat-api
  - heat-engine

# Extra environment variables applied to every instrumented service, layered
# above otel_common_environment and below each service's own `environment`.
otel_extra_environment: {}

# Common OTEL_* environment shared by every instrumented service. Per-service
# identity (OTEL_SERVICE_NAME, OTEL_RESOURCE_ATTRIBUTES) is added in tasks.
otel_common_environment:
  OTEL_EXPORTER_OTLP_ENDPOINT: "{{ otel_exporter_endpoint }}"
  OTEL_EXPORTER_OTLP_PROTOCOL: "{{ otel_exporter_protocol }}"
  OTEL_TRACES_EXPORTER: "{{ otel_traces_exporter }}"
  OTEL_METRICS_EXPORTER: "{{ otel_metrics_exporter }}"
  OTEL_LOGS_EXPORTER: "{{ otel_logs_exporter }}"
  OTEL_TRACES_SAMPLER: "{{ otel_traces_sampler }}"
  OTEL_TRACES_SAMPLER_ARG: "{{ otel_traces_sampler_arg }}"
  OTEL_PROPAGATORS: "{{ otel_propagators }}"
